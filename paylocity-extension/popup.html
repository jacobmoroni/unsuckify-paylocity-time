<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 240px;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    padding: 14px;
  }
  h1 {
    color: #cba6f7;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  label { color: #6c7086; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  input[type="number"], select {
    background: #313244;
    color: #cdd6f4;
    border: 1px solid #45475a;
    border-radius: 4px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    width: 58px;
  }
  input[type="number"]:focus, select:focus { outline: 1px solid #cba6f7; }
  .sep { color: #6c7086; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  /* toggle switch */
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #45475a; border-radius: 20px; cursor: pointer;
    transition: background .2s;
  }
  .slider::before {
    content: ''; position: absolute;
    width: 14px; height: 14px; left: 3px; bottom: 3px;
    background: #cdd6f4; border-radius: 50%;
    transition: transform .2s;
  }
  input:checked + .slider { background: #a6e3a1; }
  input:checked + .slider::before { transform: translateX(16px); }

  #save-btn {
    width: 100%;
    background: #cba6f7;
    color: #1e1e2e;
    border: none;
    border-radius: 5px;
    padding: 7px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
  }
  #save-btn:hover { background: #d0b4fa; }
  #status {
    font-size: 11px;
    color: #6c7086;
    min-height: 16px;
    margin-top: 8px;
    text-align: center;
  }
  #next-alarm {
    font-size: 10px;
    color: #6c7086;
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>⏱ Paylocity Reminder</h1>

  <div class="toggle-row">
    <label for="enabled-toggle">Reminder</label>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle">
      <span class="slider"></span>
    </label>
    <span id="enabled-label" style="font-size:12px;color:#6c7086;">Off</span>
  </div>

  <div class="row">
    <label>Time</label>
    <input type="number" id="hour" min="0" max="23" value="16">
    <span class="sep">:</span>
    <input type="number" id="minute" min="0" max="59" value="0" style="width:52px;">
  </div>

  <button id="save-btn">Save</button>
  <div id="status"></div>
  <div id="next-alarm"></div>

  <hr style="border:none;border-top:1px solid #45475a;margin:12px 0;">
  <button id="log-btn" style="width:100%;background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:5px;padding:7px;font-family:inherit;font-size:12px;cursor:pointer;">Log today's hours</button>

  <script src="popup.js"></script>
</body>
</html>
